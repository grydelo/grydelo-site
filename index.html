<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--head-->
  <meta name="theme-color" content="#f6f5f1" />
  <script>
    // Theme before first paint (light unless the visitor picked dark), plus a `js` hook for scroll reveals.
    (function () {
      var t = null;
      try { t = localStorage.getItem('grydelo.theme'); } catch (e) {}
      var root = document.documentElement;
      root.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      root.classList.add('js');
      if (t === 'dark') document.querySelector('meta[name=theme-color]').setAttribute('content', '#0a0a0c');
    })();
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://mamhodabqvalbcvsqqgp.supabase.co" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script type="module" src="/src/main.js"></script>
</head>

</html>
